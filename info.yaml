# Tiny Tapeout project information
project:
  title:        "Mockingbird"      # Project title
  author:       "Jamie Gilbert"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Reprogrammable protocol emulator for UART, SPI, I2C and beyond"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     50000000  # 50 MHz target; drop to 25 MHz if timing analysis fails

  # How many tiles your design occupies? A single tile is about 202x155 uM.
  tiles: "8x4"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2, 8x2, 3x4, 4x4, 5x4, 6x4 or 8x4

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_ja_gilbert_mockingbird"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "engine.v"
    - "host_port.v"
    - "fifo8.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "IN0 (engine input 0)"
  ui[1]: "IN1 (engine input 1)"
  ui[2]: "IN2 (engine input 2)"
  ui[3]: "IN3 (engine input 3)"
  ui[4]: "IN4 (engine input 4)"
  ui[5]: "HOST_CS (SPI host port, active low)"
  ui[6]: "HOST_SCK (SPI host port)"
  ui[7]: "HOST_MOSI (SPI host port)"

  # Outputs
  uo[0]: "OUT0 (engine output 0)"
  uo[1]: "OUT1 (engine output 1)"
  uo[2]: "OUT2 (engine output 2)"
  uo[3]: "OUT3 (engine output 3)"
  uo[4]: "OUT4 (engine output 4)"
  uo[5]: "OUT5 (engine output 5)"
  uo[6]: "OUT6 (engine output 6)"
  uo[7]: "HOST_MISO (SPI host port)"

  # Bidirectional pins
  uio[0]: "IO8 (engine pin 8, direction programmable)"
  uio[1]: "IO9 (engine pin 9)"
  uio[2]: "IO10 (engine pin 10)"
  uio[3]: "IO11 (engine pin 11)"
  uio[4]: "IO12 (engine pin 12)"
  uio[5]: "IO13 (engine pin 13)"
  uio[6]: "IO14 (engine pin 14)"
  uio[7]: "IO15 (engine pin 15)"

# Do not change!
yaml_version: 6
